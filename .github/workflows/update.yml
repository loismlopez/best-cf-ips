# GitHub 上自动运行：每 6 小时跑一次，测完有变化就提交。
# 全局 top 文件是 Runner 延迟排的（Azure 机房，美国优先），只作参考。
# 地区文件 top-jp / top-us / top-sg 是中国源站测好的顺序（build_region.py），
# 不用 Runner 延迟重排，才是从中国看最快的地区排名。
name: update
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect + scan
        run: |
          python3 collect.py
          python3 scan.py --input candidates_no104.txt
          python3 build_region.py --region jp
          python3 build_region.py --region us
          python3 build_region.py --region sg
          python3 merge_regions.py
          echo "--- top20 (Runner latency) ---"
          head -n 12 best-cf-ip-scanned-top20.txt
          echo "--- merged region file ---"
          head -n 12 best-cf-ip-scanned-top-region.txt
      - name: commit and push
        run: |
          git config user.name "cf-scan-bot"
          git config user.email "cf-scan-bot@users.noreply.github.com"
          git add best-cf-ip-scanned-top*.txt result.csv result-jp.csv result-us.csv result-sg.csv candidates_*.txt
          git diff --cached --quiet && echo "no change" || git commit -m "top cf ips updated $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
          git push
